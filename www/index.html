<!doctype html><html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark"><title>书源检测</title>
<style>
:root{--tx:#111318;--sub:rgba(60,60,67,.62);--sep:rgba(60,60,67,.14);--ok:#34c759;--un:#ff9500;--dead:#ff3b30;--wait:#8e8e93;--tint:#0a84ff;--tint2:#7d5cff;
 --g1:rgba(255,255,255,.62);--g2:rgba(255,255,255,.28);--gb:rgba(255,255,255,.7);--gs:rgba(30,40,80,.14);--hi:rgba(255,255,255,.95);--chip:rgba(120,120,128,.14);
 --bg1:#e8eefc;--bg2:#f6e9f7;--b1:rgba(10,132,255,.38);--b2:rgba(191,90,242,.30);--b3:rgba(48,209,88,.26);
 --spring:cubic-bezier(.34,1.56,.64,1)}
@media(prefers-color-scheme:dark){:root{--tx:#f5f6fa;--sub:rgba(235,235,245,.6);--sep:rgba(255,255,255,.12);--ok:#30d158;--un:#ff9f0a;--dead:#ff453a;--tint:#409cff;--tint2:#9b7bff;
 --g1:rgba(255,255,255,.14);--g2:rgba(255,255,255,.05);--gb:rgba(255,255,255,.22);--gs:rgba(0,0,0,.45);--hi:rgba(255,255,255,.5);--chip:rgba(255,255,255,.1);
 --bg1:#07080d;--bg2:#10121c;--b1:rgba(10,132,255,.45);--b2:rgba(191,90,242,.38);--b3:rgba(48,209,88,.22)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg1)}
body{margin:0;font:16px/1.45 -apple-system,"SF Pro Text","PingFang SC",sans-serif;color:var(--tx);min-height:100vh;
 padding:0 14px calc(120px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased}
/* 流动背景 */
.bg{position:fixed;inset:-20%;z-index:-1;background:
 radial-gradient(38% 30% at 20% 22%,var(--b1),transparent 70%),
 radial-gradient(34% 28% at 82% 30%,var(--b2),transparent 70%),
 radial-gradient(40% 32% at 55% 85%,var(--b3),transparent 70%),
 linear-gradient(160deg,var(--bg1),var(--bg2));animation:drift 26s ease-in-out infinite alternate}
@keyframes drift{0%{transform:translate3d(-3%,-2%,0) scale(1)}50%{transform:translate3d(3%,2%,0) scale(1.08)}100%{transform:translate3d(-2%,4%,0) scale(1.03)}}
/* 玻璃 */
.glass{position:relative;background:linear-gradient(145deg,var(--g1),var(--g2));
 -webkit-backdrop-filter:blur(26px) saturate(190%);backdrop-filter:blur(26px) saturate(190%);
 border:.5px solid var(--gb);border-radius:26px;
 box-shadow:inset 0 1px 0 var(--hi),inset 0 -1px 0 rgba(255,255,255,.08),inset 1px 0 0 rgba(255,255,255,.12),0 10px 34px var(--gs);overflow:hidden}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
 background:radial-gradient(140px 120px at var(--mx,18%) var(--my,0%),rgba(255,255,255,.34),transparent 70%);opacity:var(--ml,.5);transition:opacity .3s}
.card{padding:14px;margin-bottom:14px}
/* 大标题 + 吸顶小标题 */
.top{position:sticky;top:0;z-index:20;margin:0 -14px;padding:calc(env(safe-area-inset-top) + 6px) 14px 6px;height:calc(env(safe-area-inset-top) + 48px);display:flex;align-items:flex-end;justify-content:center;
 opacity:0;transition:opacity .25s;pointer-events:none}
.top.on{opacity:1}
.top::before{content:"";position:absolute;inset:0;-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);
 background:linear-gradient(var(--g1),transparent);-webkit-mask:linear-gradient(#000 70%,transparent);mask:linear-gradient(#000 70%,transparent)}
.top span{position:relative;font-weight:600;font-size:16px;padding-bottom:6px}
.large{margin:calc(env(safe-area-inset-top) - 36px) 4px 14px;display:flex;justify-content:space-between;align-items:baseline;transition:transform .2s,opacity .2s;transform-origin:left bottom}
.large h1{font-size:34px;letter-spacing:.3px;margin:0;font-weight:800}
.large small{font-size:13px;color:var(--sub)}
/* 进度 */
.prog{height:12px;border-radius:7px;background:var(--chip);box-shadow:inset 0 1px 2px rgba(0,0,0,.18);overflow:hidden;position:relative}
.prog i{display:block;height:100%;width:0;border-radius:7px;background:linear-gradient(90deg,var(--tint),var(--tint2) 60%,var(--ok));
 box-shadow:0 0 14px color-mix(in srgb,var(--tint) 70%,transparent),inset 0 1px 0 rgba(255,255,255,.6);transition:width .6s cubic-bezier(.22,1,.36,1);position:relative}
.prog i::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.65) 50%,transparent 70%);transform:translateX(-100%)}
.running .prog i::after{animation:shine 1.4s linear infinite}
@keyframes shine{to{transform:translateX(100%)}}
.pct{display:flex;justify-content:space-between;font-size:12.5px;color:var(--sub);margin:8px 2px 0;font-variant-numeric:tabular-nums}
/* 统计磁贴 */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.stat{border-radius:18px;padding:10px 2px 8px;text-align:center;background:var(--chip);border:.5px solid transparent;transition:transform .45s var(--spring),background .25s,box-shadow .25s,border-color .25s}
.stat:active{transform:scale(.92)}
.stat b{display:block;font-size:24px;line-height:1.15;font-weight:700;font-variant-numeric:tabular-nums}
.stat span{font-size:11.5px;color:var(--sub)}
.stat.on{background:linear-gradient(145deg,var(--g1),var(--g2));border-color:var(--gb);transform:scale(1.04);box-shadow:inset 0 1px 0 var(--hi),0 6px 18px var(--gs)}
.stat[data-k=OK] b{color:var(--ok)}.stat[data-k=UNCERTAIN] b{color:var(--un)}.stat[data-k=DEAD] b{color:var(--dead)}.stat[data-k=WAIT] b{color:var(--wait)}
.stat b.bump{animation:bump .5s var(--spring)}
@keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.35)}100%{transform:scale(1)}}
/* 按钮 */
.btn{position:relative;border:0;border-radius:999px;padding:11px 18px;font:600 15px -apple-system,"PingFang SC",sans-serif;color:var(--tx);
 background:var(--chip);transition:transform .4s var(--spring),filter .2s,opacity .2s;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:active{transform:scale(.92)}.btn:disabled{opacity:.38}
.btn.tint{color:#fff;background:linear-gradient(145deg,var(--tint),var(--tint2));box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 6px 18px color-mix(in srgb,var(--tint) 45%,transparent)}
.btn.s{background:var(--chip)}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.tools .btn{padding:9px 15px;font-size:14px}
/* 选择文件 */
.drop{border-radius:20px;padding:20px 14px;text-align:center;color:var(--sub);position:relative;background:var(--chip);border:1px dashed var(--sep);transition:transform .4s var(--spring)}
.drop:active{transform:scale(.97)}
.drop input{position:absolute;inset:0;opacity:0;width:100%}.drop b{color:var(--tint)}
details summary{cursor:pointer;color:var(--sub);font-size:14px;margin-top:12px;list-style:none}
details summary::-webkit-details-marker{display:none}
.set{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.set label{font-size:12px;color:var(--sub)}
.set input{width:100%;margin-top:4px;padding:10px;border:0;border-radius:12px;background:var(--chip);color:var(--tx);font-size:16px;outline:none}
/* 搜索与列表 */
#q{width:100%;padding:11px 14px;border:0;border-radius:999px;background:var(--chip);color:var(--tx);font-size:16px;outline:none;margin-bottom:6px}
.item{display:flex;gap:11px;padding:12px 2px;border-top:.5px solid var(--sep)}.item:first-child{border-top:0}
.dot{flex:none;width:5px;border-radius:3px;margin:3px 0}
.dot.OK{background:var(--ok);box-shadow:0 0 8px var(--ok)}.dot.UNCERTAIN{background:var(--un);box-shadow:0 0 8px var(--un)}.dot.DEAD{background:var(--dead);box-shadow:0 0 8px var(--dead)}.dot.WAIT{background:var(--wait)}
.nm{font-weight:600;word-break:break-all}.u{font-size:12.5px;color:var(--sub);word-break:break-all}
.m{font-size:13.5px;margin-top:3px}.m.OK{color:var(--ok)}.m.UNCERTAIN{color:var(--un)}.m.DEAD{color:var(--dead)}.m.WAIT{color:var(--sub)}
.ms{color:var(--sub);font-size:11.5px;margin-left:4px}
.more{width:100%;margin-top:8px}
.empty{text-align:center;color:var(--sub);padding:30px 0}
h3{margin:0 0 2px;font-size:15px}
#warn{display:none;margin-bottom:12px;padding:12px 14px;border-radius:18px;background:color-mix(in srgb,var(--dead) 20%,transparent);color:var(--dead);font-size:14px}
#exbox{display:none}
/* 悬浮底栏 */
.dock{background:linear-gradient(145deg,var(--g1),var(--g2)),color-mix(in srgb,var(--bg1) 55%,transparent);-webkit-backdrop-filter:blur(34px) saturate(200%);backdrop-filter:blur(34px) saturate(200%);position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:30;display:flex;gap:8px;padding:8px;border-radius:999px;width:min(440px,calc(100% - 28px))}
.dock .btn{flex:1;padding:13px 10px;font-size:16px}.dock .btn.tint{flex:2}
.dock::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;box-shadow:inset 0 0 22px rgba(255,255,255,.12)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div class="bg"></div>
<div class="top" id="top"><span>书源检测</span></div>
<div class="large" id="large"><h1>书源检测</h1><small id="sub">未载入</small></div>
<div id="warn">⚠ 检测服务已断开，已自动暂停。</div>

<div class="card glass">
 <div class="prog"><i id="pb"></i></div>
 <div class="pct"><span id="pt">0%</span><span id="eta"></span></div>
 <div class="stats" id="stats"></div>
</div>

<div class="card glass">
 <div class="drop"><input type="file" id="file" accept=".json,.txt"><div id="dtxt">📂 <b>点击选择书源 JSON</b></div></div>
 <details><summary>⚙︎ 检测参数</summary><div class="set">
  <div><label>并发</label><input type="number" id="conc" value="20" min="1" max="40"></div>
  <div><label>超时(秒)</label><input type="number" id="to" value="12"></div>
  <div><label>关键词</label><input type="text" id="kw" value="我"></div></div></details>
 <div class="tools"><button class="btn s" onclick="dedupe()">去重</button><button class="btn s" onclick="retry()">重测失效</button><button class="btn s" onclick="clr()">清空</button></div>
</div>

<div class="card glass" id="exbox"></div>

<div class="card glass"><input id="q" type="search" placeholder="搜索名称 / 地址 / 原因" oninput="lim=100;render()"><div id="list"></div></div>

<div class="card glass"><h3>导出</h3>
 <div class="tools"><button class="btn tint" onclick="exp('OK')">可用</button><button class="btn tint" onclick="exp('OKU')">可用+疑似</button><button class="btn s" onclick="exp('UNCERTAIN')">疑似</button><button class="btn s" onclick="exp('DEAD')">失效</button></div></div>

<nav class="dock glass">
 <button class="btn tint" id="go" disabled><svg width="16" height="16" viewBox="0 0 24 24"><path fill="currentColor" d="M7 4.5v15a1 1 0 0 0 1.5.86l12-7.5a1 1 0 0 0 0-1.72l-12-7.5A1 1 0 0 0 7 4.5z"/></svg>开始检测</button>
 <button class="btn" id="pause" disabled>暂停</button>
</nav>
<script src="engine.js"></script>
<script>
const __cb={};let __n=0;
window.__nativeReply=(id,o)=>{const f=__cb[id];if(f){delete __cb[id];f(o)}};
function nat(op,payload){return new Promise(r=>{const id='n'+(++__n);__cb[id]=r;window.webkit.messageHandlers.native.postMessage({id,op,payload})})}
const native={
 http:o=>nat('http',o),
 enc:(s,cs)=>nat('enc',{s,cs}).then(r=>r.v),
 jsEval:o=>nat('jsEval',o)
};
const ENG=BSEngine(native,{});
</script>
<script>
let src=[],res=[],paused=false,running=false,filter='ALL',lim=100,online=true,wl=null,t0=0,d0=0;
const $=id=>document.getElementById(id),K='bsc_v2',NM={OK:'可用',UNCERTAIN:'疑似',DEAD:'失效',WAIT:'待测'};
function save(){try{localStorage.setItem(K,JSON.stringify({src,res}))}catch(e){}}
function load(){try{let d=JSON.parse(localStorage.getItem(K));if(d&&d.src){src=d.src;res=d.res;$('go').disabled=false}}catch(e){}}
function clr(){if(running||!confirm('清空已载入的书源和结果？'))return;src=[];res=[];localStorage.removeItem(K);$('dtxt').innerHTML='📂 <b>点击选择书源 JSON</b>';$('go').disabled=true;render()}
$('file').onchange=async e=>{let f=e.target.files[0];if(!f)return;let t=await f.text();try{let j=JSON.parse(t);src=Array.isArray(j)?j:[j]}catch(x){alert('JSON 解析失败');return}
res=src.map(_=>({state:'WAIT',msg:'待检测'}));$('go').disabled=false;$('dtxt').innerHTML='✅ '+esc(f.name)+'（'+src.length+' 条）';save();render()};
function dedupe(){if(running)return;let seen=new Set(),ns=[],nr=[];src.forEach((s,i)=>{let k=(s.bookSourceUrl||'')+'|'+(s.bookSourceName||'');if(seen.has(k))return;seen.add(k);ns.push(s);nr.push(res[i])});
alert(`去重：${src.length} → ${ns.length}`);src=ns;res=nr;save();render()}
function retry(){if(running)return;let n=0;res.forEach((r,i)=>{if(r.state=='DEAD'){res[i]={state:'WAIT',msg:'待检测'};n++}});if(!n)return alert('没有失效项');save();render();$('go').click()}
function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function render(){let c={OK:0,UNCERTAIN:0,DEAD:0,WAIT:0};res.forEach(r=>c[r.state]++);let n=src.length,d=n-c.WAIT,p=n?Math.round(d/n*100):0;
$('pb').style.width=p+'%';$('pt').textContent=n?`${d} / ${n}（${p}%）`:'0%';$('sub').textContent=n?`共 ${n} 条`:'未载入';
let el=(Date.now()-t0)/1000;if(running&&t0>0&&d>d0&&el>2){let sp=(d-d0)/el,left=c.WAIT/sp;$('eta').textContent=(isFinite(left)&&left<86400)?`约剩 ${left>90?Math.round(left/60)+' 分钟':Math.round(left)+' 秒'}`:''}else $('eta').textContent='';
$('stats').innerHTML=[['OK','可用'],['UNCERTAIN','疑似'],['DEAD','失效'],['WAIT','待测']].map(([k,t])=>`<div class="stat ${filter==k?'on':''}" data-k="${k}" onclick="filter=filter=='${k}'?'ALL':'${k}';lim=100;render()"><b>${c[k]}</b><span>${t}</span></div>`).join('');
let q=$('q').value.trim().toLowerCase(),h='',m=0,tot=0;
for(let i=0;i<n;i++){let r=res[i];if(filter!='ALL'&&r.state!=filter)continue;
if(q&&!((src[i].bookSourceName||'')+(src[i].bookSourceUrl||'')+r.msg).toLowerCase().includes(q))continue;tot++;if(m>=lim)continue;m++;
h+=`<div class="item"><div class="dot ${r.state}"></div><div style="min-width:0"><div class="nm">${esc(src[i].bookSourceName||'(无名)')}</div><div class="u">${esc(src[i].bookSourceUrl||'')}</div><div class="m ${r.state}">${NM[r.state]} · ${esc(r.msg)} ${r.ms?`<span class="ms">${r.ms}ms</span>`:''}</div></div></div>`}
if(tot>m)h+=`<button class="btn s more" onclick="lim+=200;render()">再显示 200 条（${m}/${tot}）</button>`;
$('list').innerHTML=h||`<div class="empty">${n?'没有符合的结果':'请先载入书源文件'}</div>`}
let tm=null;function sched(){if(!tm)tm=setTimeout(()=>{tm=null;render();save()},800)}
$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'▶ 继续':'⏸ 暂停'};
function setOnline(v){online=v;$('warn').style.display=v?'none':'block'}
$('go').onclick=async()=>{if(running)return;running=true;$('go').disabled=true;$('pause').disabled=false;t0=Date.now();d0=res.filter(r=>r.state!='WAIT').length;
native_awake(true);
ENG.reset();ENG.set('timeout',+$('to').value||12);ENG.set('kw',$('kw').value||'我');
let idx=res.map((r,i)=>r.state=='WAIT'?i:-1).filter(i=>i>=0),p=0,N=+$('conc').value;
async function w(){while(p<idx.length){if(paused||!online){await new Promise(r=>setTimeout(r,500));continue}
let i=idx[p++];try{res[i]=await ENG.check(src[i])}
catch(e){res[i]={state:'DEAD',msg:'检测异常：'+String(e).slice(0,60)}}sched()}}
await Promise.all(Array.from({length:N},w));running=false;$('go').disabled=false;$('pause').disabled=true;native_awake(false);save();render()};
async function exp(k){let o=src.filter((_,i)=>k=='OKU'?['OK','UNCERTAIN'].includes(res[i].state):res[i].state==k);if(!o.length)return alert('没有数据');
let txt=JSON.stringify(o,null,1),name=`书源_${k}_${o.length}.json`;window._ex=txt;window._nm=name;
let box=$('exbox');box.style.display='block';
box.innerHTML=`<b>${name}</b>（${o.length} 条）<div class="tools"><button class="btn" onclick="sh()">分享 / 存到文件</button><button class="btn s" onclick="cp()">复制全部 JSON</button><button class="btn s" onclick="$('exbox').style.display='none'">关闭</button></div><div class="u" style="margin-top:6px">在阅读里“从剪贴板导入”，或把文件存到「文件」后导入</div>`;
box.scrollIntoView({behavior:'smooth'})}
async function cp(){await nat('clipboardWrite',{text:window._ex});alert('已复制，到阅读里“从剪贴板导入”即可')}
async function sh(){await nat('shareFile',{name:window._nm,text:window._ex})}
function native_awake(on){nat('keepAwake',{on})}
load();if(src.length)$('dtxt').innerHTML='✅ 已恢复上次载入（'+src.length+' 条）';render();
</script>
<script>
/* ---- iOS 26 动效层 ---- */
(function(){
 const hap=()=>{try{nat('haptic',{}).catch&&0}catch(e){}};
 // 触点高光：手指/指针划过玻璃时，镜面高光跟随
 function lite(e){const g=e.target.closest&&e.target.closest('.glass');if(!g)return;const r=g.getBoundingClientRect(),t=e.touches?e.touches[0]:e;
  g.style.setProperty('--mx',(t.clientX-r.left)+'px');g.style.setProperty('--my',(t.clientY-r.top)+'px');g.style.setProperty('--ml','.95')}
 function dim(e){document.querySelectorAll('.glass').forEach(g=>g.style.setProperty('--ml','.5'))}
 addEventListener('touchstart',lite,{passive:true});addEventListener('touchmove',lite,{passive:true});addEventListener('touchend',dim,{passive:true});
 addEventListener('pointermove',lite,{passive:true});addEventListener('pointerleave',dim);
 // 按压触觉
 document.addEventListener('click',e=>{if(e.target.closest('.btn,.stat'))hap()},true);
 // 滚动联动：大标题收缩 → 吸顶玻璃小标题
 const top=document.getElementById('top'),lg=document.getElementById('large');
 addEventListener('scroll',()=>{const y=scrollY,p=Math.min(1,Math.max(0,y/50));
  top.classList.toggle('on',y>34);lg.style.opacity=1-p;lg.style.transform=`scale(${1-p*.12}) translateY(${-p*6}px)`},{passive:true});
 // 渲染后：运行态光效 + 数字弹跳
 const prev={};const _r=render;
 render=function(){_r();document.body.classList.toggle('running',running);
  document.querySelectorAll('.stat').forEach(s=>{const k=s.dataset.k,b=s.querySelector('b'),v=b.textContent;if(prev[k]!==undefined&&prev[k]!==v){b.classList.add('bump')}prev[k]=v})}
 render();
})();
</script>
</body></html>
