<style>

.nm{font-weight:600;word-break:break-all}.u{font-size:12.5px;color:var(--sub);word-break:break-all}
.m{font-size:13.5px;margin-top:3px}.m.OK{color:var(--ok)}.m.UNCERTAIN{color:var(--un)}.m.DEAD{color:var(--dead)}.m.WAIT{color:var(--sub)}

h3{margin:0 0 2px;font-size:15px}

<script>

if(q&&!((src[i].bookSourceName||'')+(src[i].bookSourceUrl||'')+r.msg).toLowerCase().includes(q))continue;tot++;if(m>=lim)continue;m++;
const sh=shortMsg(r.msg);h+=`<div class="item" onclick="this.classList.toggle('open')"><div class="dot ${r.state}"></div><div class="bd"><div class="l1"><span class="nm">${esc(src[i].bookSourceName||'(无名)')}</span><span class="st ${r.state}">${NM[r.state]}</span></div><div class="l2">${esc(sh)}${r.ms?' · '+r.ms+'ms':''}</div><div class="more2"><div class="u">${esc(src[i].bookSourceUrl||'')}</div><div class="m ${r.state}">${esc(r.msg)}</div></div></div><span class="chev">›</span></div>`}
if(tot>m)h+=`<button class="btn s more" onclick="lim+=200;render()">再显示 200 条（${m}/${tot}）</button>`;
$('lc').textContent=n?`显示 ${Math.min(m,tot)} / ${tot} 条`+(filter!='ALL'?'（已筛选）':''):'';renderChips();const _st=$('list').scrollTop;$('list').innerHTML=h||`<div class="empty">${n?'没有符合的结果':'请先载入书源文件'}</div>`;$('list').scrollTop=_st}
let tm=null;function sched(){if(!tm)tm=setTimeout(()=>{tm=null;render();save()},800)}
$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'▶ 继续':'⏸ 暂停'};
function setOnline(v){online=v;$('warn').style.display=v?'none':'block'}
$('go').onclick=async()=>{if(running)return;running=true;$('go').disabled=true;$('pause').disabled=false;t0=Date.now();d0=res.filter(r=>r.state!='WAIT').length;
native_awake(true);
ENG.reset();pbHost.clear();ENG.set('timeout',+$('to').value||12);ENG.set('kw',$('kw').value||'我');
let idx=res.map((r,i)=>r.state=='WAIT'?i:-1).filter(i=>i>=0),p=0,N=+$('conc').value;
async function w(){while(p<idx.length){if(paused||!online){await new Promise(r=>setTimeout(r,500));continue}
let i=idx[p++];try{res[i]=src[i]._pb?await checkPB(src[i]):await ENG.check(src[i])}
catch(e){res[i]={state:'DEAD',msg:'检测异常：'+String(e).slice(0,60)}}sched()}}
await Promise.all(Array.from({length:N},w));running=false;$('go').disabled=false;$('pause').disabled=true;native_awake(false);save();render()};
async function exp(k,o){o=o||src.filter((_,i)=>k=='OKU'?['OK','UNCERTAIN'].includes(res[i].state):res[i].state==k);if(!o.length)return alert('没有数据');
let txt=JSON.stringify(o.map(x=>{const y=Object.assign({},x);delete y._pb;delete y._enc;return y}),null,1),name=`书源_${k}_${o.length}.json`;window._ex=txt;window._nm=name;
let box=$('exbox');box.style.display='block';
box.innerHTML=`<b>${name}</b>（${o.length} 条）<div class="tools"><button class="btn" onclick="sh()">分享 / 存到文件</button><button class="btn s" onclick="cp()">复制全部 JSON</button><button class="btn s" onclick="$('exbox').style.display='none'">关闭</button></div><div class="u" style="margin-top:6px">在阅读里“从剪贴板导入”，或把文件存到「文件」后导入</div>`;
box.scrollIntoView({behavior:'smooth'})}
async function cp(){await nat('clipboardWrite',{text:window._ex});alert('已复制，到阅读里“从剪贴板导入”即可')}
async function sh(){await nat('shareFile',{name:window._nm,text:window._ex})}
function native_awake(on){nat('keepAwake',{on})}
$('list').addEventListener('scroll',()=>{$('ltop').style.display=$('list').scrollTop>300?'':'none'},{passive:true});
load();if(src.length)$('dtxt').innerHTML='✅ 已恢复上次载入（'+src.length+' 条）';render();
</script>
<script>
/* ---- 用心读书备份模式 ---- */
const pbHost=new Map();
async function checkPB(s){const t0=Date.now(),kw=$('kw').value||'我',to=+$('to').value||12;
 const one=async()=>{const p=await PBPrepare(native,s._pb,kw);
  if(p.kind=='skip')return['KEEP',p.why];
  if(p.kind=='host'){if(!p.url)return['UNCERTAIN',p.why+'（无站点地址）'];
   if(!pbHost.has(p.url))pbHost.set(p.url,native.http({url:p.url,method:'GET',headers:{'User-Agent':'Mozilla/5.0',Accept:'*/*'},body:null,charset:'',timeout:to}));
   const h=await pbHost.get(p.url);if(!h.ok)return['DEAD',h.msg];
   if(h.status>=200&&h.status<400)return['UNCERTAIN','站点可达；'+p.why];if([401,403].includes(h.status))return['UNCERTAIN','HTTP '+h.status+'；'+p.why];return['DEAD','HTTP '+h.status+' 站点不可用']}
  const r=await native.http({url:p.req.url,method:p.req.method,headers:p.req.headers,body:p.req.body,charset:p.req.cs!='utf-8'?p.req.cs:'',timeout:to});
  return PBJudge(r,p.req.notes)};
 let[st,m]=await one();if(st=='DEAD'&&/超时|重置|连接失败/.test(m)){const r=await one();st=r[0];m=r[1];if(st=='DEAD')m+='（已重试）'}
 return{state:st,msg:m,ms:Date.now()-t0}}
let mode='json',pbRows=[];
function setMode(m){if(running)return;mode=m;$('m1').classList.toggle('on',m=='json');$('m2').classList.toggle('on',m=='pb');$('dropJ').style.display=m=='json'?'':'none';$('dropP').style.display=m=='pb'?'':'none';
 $('expJ').style.display=m=='pb'?'none':'';$('expP').style.display=m=='pb'?'':'none';if(m=='pb')loadDocs();renderChips()}
function fmtSz(n){return n>1048576?(n/1048576).toFixed(1)+' MB':Math.round(n/1024)+' KB'}
async function loadDocs(){const r=await nat('listDocs',{});const box=$('docs');if(!r.ok||!r.files.length){box.innerHTML='<div class="u">App 文件夹里还没有 zip。把备份 zip 复制到「文件」→ 我的 iPhone → 书源检测 即可。</div>';return}
 box.innerHTML=r.files.map((f,i)=>`<div class="item" onclick="openDoc(${i})"><div class="bd"><div class="l1"><span class="nm">${esc(f[0])}</span><span class="st WAIT">${fmtSz(f[1])}</span></div><div class="l2">点击读取</div></div><span class="chev">›</span></div>`).join('');window.__docs=r.files}
async function openDoc(i){const f=window.__docs[i];if(!f||window.__pbBusy)return;window.__pbBusy=true;
 const waitP=new Promise(ok=>{window.__pbWait=ok;setTimeout(()=>ok({ok:false,err:'读取超过 90 秒无响应'}),90000)});
 $('ptxt').innerHTML='正在读取 '+esc(f[0])+'…';
 const first=await nat('pbOpenPath',{path:f[2]});
 if(!first.ok){window.__pbBusy=false;window.__pbWait=null;$('ptxt').innerHTML='🗂 <b>从「文件」选择备份 zip</b><div class="u" style="color:var(--dead)">'+esc(first.err)+'</div>';return}
 await finishPb(await waitP)}
window.pbIncoming=function(name){setMode('pb');window.__pbBusy=true;$('ptxt').innerHTML='已收到 '+esc(name)+'，正在读取…';
 window.__pbWait=null;window.__pbIn=new Promise(ok=>{window.__pbWait=ok;setTimeout(()=>ok({ok:false,err:'读取超过 90 秒无响应'}),90000)});window.__pbIn.then(finishPb)};
async function finishPb(r){window.__pbBusy=false;clearInterval(window.__pbTk);
 if(!r.ok){$('ptxt').innerHTML='🗂 <b>点击重新选择</b><div class="u" style="color:var(--dead)">'+esc(r.err||'未知错误')+'</div>';return}
 pbRows=r.sites.map(x=>({id:x[0],ident:x[1],name:x[2],url:x[3],xpath:x[4]}));
 src=pbRows.map(x=>({bookSourceName:x.name,bookSourceUrl:x.url,_pb:x,_enc:!String(x.xpath).startsWith('{')}));
 res=src.map(x=>x._enc?{state:'KEEP',msg:'规则已加密（禁止分享）'}:{state:'WAIT',msg:'待检测'});
 $('ptxt').innerHTML='✅ '+esc(r.name)+'（'+src.length+' 条，其中 '+src.filter(x=>x._enc).length+' 条加密将保留）';$('go').disabled=false;filter='ALL';save();render()}
async function pickBackup(){
 if(window.__pbBusy)return;window.__pbBusy=true;$('ptxt').innerHTML='请在弹出的文件选择器里选择备份 zip…';
 const fin=()=>{window.__pbBusy=false};
 const waitP=new Promise(ok=>{window.__pbWait=ok;setTimeout(()=>ok({ok:false,err:'读取超过 90 秒无响应'}),90000)});
 const first=await nat('pbPick',{});
 if(!first.ok){fin();window.__pbWait=null;$('ptxt').innerHTML='🗂 <b>点击选择用心读书备份 zip</b>'+(first.err&&first.err!='cancel'?'<div class="u">'+esc(first.err)+'</div>':'');return}
 let t0=Date.now();const tk=setInterval(()=>{$('ptxt').innerHTML='已选择 '+esc(first.name||'')+'，正在读取… '+Math.round((Date.now()-t0)/1000)+' 秒'},500);window.__pbTk=tk;
 const r=await waitP;
 fin();clearInterval(window.__pbTk);
 if(!r.ok){$('ptxt').innerHTML='🗂 <b>点击重新选择</b><div class="u" style="color:var(--dead)">'+esc(r.err||'未知错误')+'</div>';return}
 pbRows=r.sites.map(x=>({id:x[0],ident:x[1],name:x[2],url:x[3],xpath:x[4]}));
 src=pbRows.map(x=>({bookSourceName:x.name,bookSourceUrl:x.url,_pb:x,_enc:!String(x.xpath).startsWith('{')}));
 res=src.map(x=>x._enc?{state:'KEEP',msg:'规则已加密（禁止分享）'}:{state:'WAIT',msg:'待检测'});
 $('ptxt').innerHTML='✅ '+esc(r.name)+'（'+src.length+' 条，其中 '+src.filter(x=>x._enc).length+' 条加密将保留）';$('go').disabled=false;filter='ALL';save();render()}
const selJ={OK:true,UNCERTAIN:true,DEAD:false},selP={OK:true,UNCERTAIN:true,DEAD:false};
const CN={OK:'可用',UNCERTAIN:'疑似',DEAD:'失效'};
function cnt(){const c={OK:0,UNCERTAIN:0,DEAD:0,KEEP:0,WAIT:0};res.forEach(r=>c[r.state]=(c[r.state]||0)+1);return c}
function renderChips(){const c=cnt();
 const mk=(sel,fn)=>['OK','UNCERTAIN','DEAD'].map(k=>`<span class="chip ${sel[k]?'on':''}" data-k="${k}" onclick="${fn}('${k}')"><i></i>${CN[k]} <b>${c[k]}</b></span>`).join('');
 $('chipsJ').innerHTML=mk(selJ,'togJ');$('chipsP').innerHTML=mk(selP,'togP');
 const keep=['OK','UNCERTAIN','DEAD'].filter(k=>selP[k]).reduce((a,k)=>a+c[k],0)+c.KEEP,del=['OK','UNCERTAIN','DEAD'].filter(k=>!selP[k]).reduce((a,k)=>a+c[k],0);
 $('expSum').innerHTML=`将保留 <b>${keep}</b> 条（含加密 ${c.KEEP}），删除 <b>${del}</b> 条${c.WAIT?`；另有 ${c.WAIT} 条未检测，一律保留`:''}`;
 $('btnJ').disabled=!['OK','UNCERTAIN','DEAD'].some(k=>selJ[k]&&c[k]);$('btnP').disabled=!del}
function togJ(k){selJ[k]=!selJ[k];renderChips()}
function togP(k){selP[k]=!selP[k];renderChips()}
function expSel(){const ks=['OK','UNCERTAIN','DEAD'].filter(k=>selJ[k]);const o=src.filter((_,i)=>ks.includes(res[i].state));if(!o.length)return alert('所选类别没有数据');
 exp(ks.join(''),o)}
async function expBackup(){const del=src.map((x,i)=>(['OK','UNCERTAIN','DEAD'].includes(res[i].state)&&!selP[res[i].state])?x._pb.id:null).filter(x=>x!==null);
 if(!del.length)return alert('没有需要删除的书源');
 const keepNames=['OK','UNCERTAIN','DEAD'].filter(k=>selP[k]).map(k=>CN[k]).join('、')||'无';
 if(!confirm(`将从备份包中删除 ${del.length} 条书源，生成新的备份 zip。\n\n保留：${keepNames}，以及全部加密源和未检测的书源。\n恢复前请先在用心读书里另做一份新备份。继续？`))return;
 const r=await nat('pbExport',{ids:del,name:'用心读书备份_已清理_删'+del.length+'条.zip'});
 if(!r.ok)alert('导出失败：'+r.err);}
/* ---- iOS 26 动效层 ---- */
(function(){
 const hap=()=>{try{nat('haptic',{}).catch&&0}catch(e){}};
 // 触点高光：手指/指针划过玻璃时，镜面高光跟随
 function lite(e){const g=e.target.closest&&e.target.closest('.glass');if(!g)return;const r=g.getBoundingClientRect(),t=e.touches?e.touches[0]:e;
  g.style.setProperty('--mx',(t.clientX-r.left)+'px');g.style.setProperty('--my',(t.clientY-r.top)+'px');g.style.setProperty('--ml','.95')}
 function dim(e){document.querySelectorAll('.glass').forEach(g=>g.style.setProperty('--ml','.5'))}
 addEventListener('touchstart',lite,{passive:true});addEventListener('touchmove',lite,{passive:true});addEventListener('touchend',dim,{passive:true});
 addEventListener('pointermove',lite,{passive:true});addEventListener('pointerleave',dim);
 // 按压触觉
 document.addEventListener('click',e=>{if(e.target.closest('.btn,.stat'))hap()},true);
 // 滚动联动：大标题收缩 → 吸顶玻璃小标题
 const top=document.getElementById('top'),lg=document.getElementById('large');
 addEventListener('scroll',()=>{const y=scrollY,p=Math.min(1,Math.max(0,y/50));
  top.classList.toggle('on',y>34);lg.style.opacity=1-p;lg.style.transform=`scale(${1-p*.12}) translateY(${-p*6}px)`},{passive:true});
 // 渲染后：运行态光效 + 数字弹跳
 const prev={};const _r=render;
 render=function(){_r();document.body.classList.toggle('running',running);
  document.querySelectorAll('.stat').forEach(s=>{const k=s.dataset.k,b=s.querySelector('b'),v=b.textContent;if(prev[k]!==undefined&&prev[k]!==v){b.classList.add('bump')}prev[k]=v})}
 render();
})();
</script>
