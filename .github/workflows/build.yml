name: build
permissions:
  contents: write
on:
  workflow_dispatch:
    inputs:
      release:
        description: "发布到 Release（仅手动运行且勾选时生效）"
        type: boolean
        default: false
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build unsigned IPA
        run: |
          set -e
          APP=build/Payload/BookSourceCheck.app
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          mkdir -p $APP
          xcrun -sdk iphoneos swiftc -target arm64-apple-ios15.0 -sdk "$SDK" -O -o $APP/BookSourceCheck Sources/main.swift
          cp Info.plist $APP/
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" $APP/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 1.0.${{ github.run_number }}" $APP/Info.plist
          cp -R www $APP/www
          for spec in "60x60@2x:120" "60x60@3x:180" "76x76:76" "76x76@2x:152" "83.5x83.5@2x:167" "40x40@2x:80" "40x40@3x:120" "29x29@2x:58" "29x29@3x:87"; do
            name="${spec%%:*}"; px="${spec##*:}"
            sips -z "$px" "$px" www/icons/icon-1024.png --out "$APP/AppIcon${name}.png"
          done
          cd build && zip -qr BookSourceCheck.ipa Payload && ls -l BookSourceCheck.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: BookSourceCheck-ipa
          path: build/BookSourceCheck.ipa
  release:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.release == true
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: BookSourceCheck-ipa
          path: build
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ github.run_number }}" build/BookSourceCheck.ipa --title "书源检测 build ${{ github.run_number }}" --notes "$(git log -1 --pretty=%s)"
